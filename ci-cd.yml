name: Level 5 CI/CD POC

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ==========================================
# WORKFLOW PERMISSIONS
# ==========================================

permissions:
  contents: read
  packages: write


jobs:

  # ==========================================
  # JOB 1: LINT
  # ==========================================

  lint:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Run lint
        run: |
          ruff check .


  # ==========================================
  # JOB 2: TEST
  # ==========================================

  test:

    needs: lint

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest


  # ==========================================
  # JOB 3: DOCKER BUILD, RUN AND PUSH
  # ==========================================

  docker-build:

    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------
      # Create lowercase image name
      # ----------------------------------------

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV


      # ----------------------------------------
      # Login to GHCR
      # ----------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------
      # Build Docker image
      # ----------------------------------------

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:latest .


      # ----------------------------------------
      # Run Docker container
      # ----------------------------------------

      - name: Run Docker container
        run: |
          docker run $IMAGE_NAME:latest


      # ----------------------------------------
      # Push Docker image to GHCR
      # ----------------------------------------

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:latest


  # ==========================================
  # JOB 4: BUILD ARTIFACT
  # ==========================================

  build:

    needs: docker-build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build package
        run: |
          mkdir build
          cp app.py build/
          cp requirements.txt build/
          zip -r application.zip build/


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-application
          path: application.zip


  # ==========================================
  # JOB 5: DEPLOY TO DEV
  # ==========================================

  deploy-dev:

    needs: build

    environment: dev

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:

      # ----------------------------------------
      # Set image name
      # ----------------------------------------

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV


      # ----------------------------------------
      # Login to GHCR
      # ----------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------
      # Pull image from GHCR
      # ----------------------------------------

      - name: Pull Docker image
        run: |
          docker pull $IMAGE_NAME:latest


      # ----------------------------------------
      # Run container in DEV
      # ----------------------------------------

      - name: Run Docker container in DEV
        run: |
          docker run $IMAGE_NAME:latest


      # ----------------------------------------
      # Deployment message
      # ----------------------------------------

      - name: DEV deployment successful
        run: |
          echo "Application deployed successfully to DEV"


  # ==========================================
  # JOB 6: DEPLOY TO PROD
  # ==========================================

  deploy-prod:

    needs: deploy-dev

    environment: prod

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:

      # ----------------------------------------
      # Set image name
      # ----------------------------------------

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV


      # ----------------------------------------
      # Login to GHCR
      # ----------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------
      # Pull image from GHCR
      # ----------------------------------------

      - name: Pull Docker image
        run: |
          docker pull $IMAGE_NAME:latest


      # ----------------------------------------
      # Run container in PROD
      # ----------------------------------------

      - name: Run Docker container in PROD
        run: |
          docker run $IMAGE_NAME:latest


      # ----------------------------------------
      # Deployment message
      # ----------------------------------------

      - name: PROD deployment successful
        run: |
          echo "Application deployed successfully to PROD"