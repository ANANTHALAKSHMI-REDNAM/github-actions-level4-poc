name: Level 4 CI/CD POC

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # -------------------------
  # JOB 1: LINT
  # -------------------------

  lint:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Run lint
        run: |
          ruff check .


  # -------------------------
  # JOB 2: TEST
  # -------------------------

  test:

    needs: lint

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest


  # -------------------------
  # JOB 3: DEPLOY DEV
  # -------------------------

  deploy-dev:

    needs: test

    environment: dev

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to DEV
        env:
          ENV_NAME: ${{ secrets.ENV_NAME }}
          DEPLOY_MESSAGE: ${{ secrets.DEPLOY_MESSAGE }}
        run: |
          echo "Environment: ${ENV_NAME}"
          echo "Deployment message: ${DEPLOY_MESSAGE}"
          echo "Application deployed successfully to DEV"


  # -------------------------
  # JOB 4: DEPLOY PROD
  # -------------------------

  deploy-prod:

    needs: deploy-dev

    environment: prod

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to PROD
        env:
          ENV_NAME: ${{ secrets.ENV_NAME }}
          DEPLOY_MESSAGE: ${{ secrets.DEPLOY_MESSAGE }}
        run: |
          echo "Environment: ${ENV_NAME}"
          echo "Deployment message: ${DEPLOY_MESSAGE}"
          echo "Application deployed successfully to PROD"