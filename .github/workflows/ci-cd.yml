name: Level 5 CI/CD POC

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# Permissions required to push Docker image to GHCR
permissions:
  contents: read
  packages: write


jobs:

  # ==========================================
  # JOB 1: LINT
  # ==========================================

  lint:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Run lint
        run: |
          ruff check .


  # ==========================================
  # JOB 2: TEST
  # ==========================================

  test:

    needs: lint

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest


  # ==========================================
  # JOB 3: DOCKER BUILD, RUN AND PUSH
  # ==========================================

  docker-build:

    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------
      # Login to GitHub Container Registry
      # ----------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------
      # Build Docker image
      # ----------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}:latest .


      # ----------------------------------------
      # Run Docker container
      # ----------------------------------------

      - name: Run Docker container
        run: |
          docker run ghcr.io/${{ github.repository }}:latest


      # ----------------------------------------
      # Push Docker image to GHCR
      # ----------------------------------------

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}:latest


  # ==========================================
  # JOB 4: BUILD ARTIFACT
  # ==========================================

  build:

    needs: docker-build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build package
        run: |
          mkdir build
          cp app.py build/
          cp requirements.txt build/
          zip -r application.zip build/


      # ----------------------------------------
      # Upload artifact
      # ----------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-application
          path: application.zip


  # ==========================================
  # JOB 5: DEPLOY TO DEV
  # ==========================================

  deploy-dev:

    needs: build

    environment: dev

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to DEV
        env:
          ENV_NAME: ${{ secrets.ENV_NAME }}
          DEPLOY_MESSAGE: ${{ secrets.DEPLOY_MESSAGE }}

        run: |
          echo "Environment: ${ENV_NAME}"
          echo "Deployment message: ${DEPLOY_MESSAGE}"
          echo "Application deployed successfully to DEV"


  # ==========================================
  # JOB 6: DEPLOY TO PROD
  # ==========================================

  deploy-prod:

    needs: deploy-dev

    environment: prod

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to PROD
        env:
          ENV_NAME: ${{ secrets.ENV_NAME }}
          DEPLOY_MESSAGE: ${{ secrets.DEPLOY_MESSAGE }}

        run: |
          echo "Environment: ${ENV_NAME}"
          echo "Deployment message: ${DEPLOY_MESSAGE}"
          echo "Application deployed successfully to PROD"